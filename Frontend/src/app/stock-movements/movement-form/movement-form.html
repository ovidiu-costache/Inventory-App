<div>
  <h2>Add stock movement</h2>

  @if (errorMessage) {
    <div class="alert-error">
      <strong>Error:</strong> {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" novalidate>
    <table class="form-table">
      <tr>
        <td><label for="productId">Product</label></td>
        <td>
          <select
            id="productId"
            [(ngModel)]="model.productId"
            name="productId"
            class="form-input">
            <option [ngValue]="0" disabled hidden>Select a product...</option>
            @for (p of products; track p.id) {
              <option [ngValue]="p.id">
                {{p.code}} - {{p.name}} (stock: {{p.currentStock}})
              </option>
            }
          </select>
        </td>
      </tr>
      <tr>
        <td><label>Movement type</label></td>
        <td>
          <select [(ngModel)]="model.movementTypeId" name="movementTypeId" class="form-input-short">
            <option [ngValue]="1">IN</option>
            <option [ngValue]="2">OUT</option>
            <option [ngValue]="3">ADJUSTMENT</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><label>Quantity</label></td>
        <td>
          <span class="quantity-row">
            <input type="number" [(ngModel)]="model.quantity" name="quantity" class="form-input-number" min="1">
            @if (model.movementTypeId === 3) {
              <span class="adjustment-direction">
                <label class="direction-label">
                  <input type="radio" [(ngModel)]="adjustmentDirection" name="adjustmentDirection" value="add"> Add
                </label>
                <label class="direction-label">
                  <input type="radio" [(ngModel)]="adjustmentDirection" name="adjustmentDirection" value="subtract"> Subtract
                </label>
              </span>
            }
          </span>
        </td>
      </tr>
      <tr>
        <td><label>Reason (optional)</label></td>
        <td><input type="text" [(ngModel)]="model.reason" name="reason" class="form-input"></td>
      </tr>
      <tr>
        <td><label>Reference Code (optional)</label></td>
        <td><input type="text" [(ngModel)]="model.referenceCode" name="referenceCode" class="form-input"></td>
      </tr>
    </table>
    <br>

    <!-- AI Review Warning Banner -->
    @if (isSuspectReview) {
      <div class="alert-error" style="background-color: #fff3cd; border-color: #e0a800; color: #856404;">
        <strong>⚠ AI Warning:</strong> {{ suspectExplanation }}
      </div>
      <button type="button" class="btn-warning" (click)="onSubmit(true)" [disabled]="isSubmitting">Confirm and submit anyway</button>
      <a routerLink="/movements" class="btn-secondary ml-2">Cancel</a>
    } @else {
      <button type="submit" class="btn-primary" [disabled]="isSubmitting">
        @if (isSubmitting) { Processing... } @else { Save }
      </button>
      <a routerLink="/movements" class="btn-secondary ml-2">Cancel</a>
    }
  </form>
</div>

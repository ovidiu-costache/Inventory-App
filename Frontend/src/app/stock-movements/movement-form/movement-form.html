<div>
  <h2>Adauga miscare stoc</h2>

  <!-- Error message (from frontend validation or backend) -->
  <div *ngIf="errorMessage" style="color: red; border: 1px solid red; padding: 8px; margin-bottom: 10px;">
    <strong>Eroare:</strong> {{ errorMessage }}
  </div>

  <!-- novalidate = let Angular/backend handle validation, not the browser -->
  <form (ngSubmit)="onSubmit()" novalidate>
    <div>
      <label>ID Produs:</label><br>
      <input type="number" [(ngModel)]="model.productId" name="productId">
    </div>
    <br>

    <div>
      <label>Tip miscare:</label><br>
      <select [(ngModel)]="model.movementTypeId" name="movementTypeId">
        <option [ngValue]="1">INTRARE</option>
        <option [ngValue]="2">IESIRE</option>
        <option [ngValue]="3">AJUSTARE</option>
      </select>
    </div>
    <br>

    <div>
      <label>Cantitate:</label><br>
      <input type="number" [(ngModel)]="model.quantity" name="quantity">
    </div>
    <br>

    <div>
      <label>Motiv (optional):</label><br>
      <input type="text" [(ngModel)]="model.reason" name="reason">
    </div>
    <br>

    <div>
      <label>Cod Referinta (optional):</label><br>
      <input type="text" [(ngModel)]="model.referenceCode" name="referenceCode">
    </div>
    <br>

    <button type="submit">Salveaza</button>
    <a routerLink="/movements" style="margin-left: 10px;">Anuleaza</a>
  </form>
</div>

<form (ngSubmit)="onSubmit()">
    <table cellpadding="6" class="form-table">
        <tr>
            <td><label for="code">Code</label></td>
            <td>
                <input id="code" type="text" [(ngModel)]="formData.code" name="code" placeholder="e.g. PROD-001"
                    class="form-input" required>
            </td>
        </tr>
        <tr>
            <td><label for="name">Name</label></td>
            <td>
                <input id="name" type="text" [(ngModel)]="formData.name" name="name" placeholder="Product name"
                    class="form-input" required>
            </td>
        </tr>
        <tr>
            <td><label for="description">Description</label></td>
            <td>
                <textarea id="description" [(ngModel)]="formData.description" name="description"
                    placeholder="Optional description" class="form-textarea"></textarea>
            </td>   
        </tr>
        <tr>
            <td><label for="categoryId">Category</label></td>
            <td>
                <select id="categoryId" [(ngModel)]="formData.categoryId" name="categoryId"
                    [class.placeholder-color]="formData.categoryId === 0" [class.normal-color]="formData.categoryId !== 0" class="form-input" required>
                    <option [ngValue]="0" disabled hidden>Choose category</option>
                    @for (category of categories; track category.id) {
                        <option [ngValue]="category.id" class="normal-color">{{ category.name }}</option>
                    }
                    <option [ngValue]="-1" class="normal-color fw-bold">-- Add New Category --</option>
                </select>
                @if (formData.categoryId === -1) {
                    <div class="mt-2">
                        <input type="text" [(ngModel)]="formData.newCategoryName" name="newCategoryName" placeholder="New category name" class="form-input" required>
                    </div>
                }
            </td>
        </tr>
        <tr>
            <td><label for="unitOfMeasure">Unit of Measure</label></td>
            <td>
                <input id="unitOfMeasure" type="text" [(ngModel)]="formData.unitOfMeasure" name="unitOfMeasure"
                    placeholder="e.g. pcs, kg, l" class="form-input-short" required>
            </td>
        </tr>
        <tr>
            <td><label for="price">Price</label></td>
            <td>
                <input id="price" type="number" [(ngModel)]="formData.price" name="price" min="0" step="0.01"
                    class="form-input-number" required>
            </td>
        </tr>
        <tr>
            <td><label for="reorderThreshold">Reorder Threshold</label></td>
            <td>
                <input id="reorderThreshold" type="number" [(ngModel)]="formData.reorderThreshold"
                    name="reorderThreshold" min="0" class="form-input-number" required>
            </td>
        </tr>
    </table>

    <br>

    <button type="submit" [disabled]="isSubmitting" class="btn-primary">
        @if (isSubmitting) {
            Saving...
        } @else {
            {{ submitLabel }}
        }
    </button>

    <button type="button" (click)="onCancel()" [disabled]="isSubmitting" class="btn-secondary ml-2">
        Cancel
    </button>
</form>

<div>
    <h2>Add New Product</h2>

    <!-- Error message -->
    @if (submitError) {
    <div class="alert-error">
        {{ submitError }}
    </div>
    }

    <app-product-form
        [formData]="formData"
        [categories]="categories"
        [isSubmitting]="isSubmitting"
        submitLabel="Save"
        (formSubmit)="onSubmit($event)"
        (formCancel)="goBack()">
    </app-product-form>
</div>

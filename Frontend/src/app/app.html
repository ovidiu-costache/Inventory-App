<nav class="navbar" *ngIf="currentUser">
  <div class="navbar-brand">Inventory App</div>
  <ul class="navbar-links">
    <li><a routerLink="/products" routerLinkActive="active">Products</a></li>
    <li><a routerLink="/movements" routerLinkActive="active">Stock Movements</a></li>
    <li>
      <a routerLink="/notifications" routerLinkActive="active" class="flex-center-gap">
        Notifications
        <span *ngIf="unreadCount > 0" class="badge-danger">
          {{ unreadCount }}
        </span>
      </a>
    </li>
    <li>
      <button (click)="logout()" class="btn-link-white">
        Logout ({{ currentUser.username }})
      </button>
    </li>
  </ul>
</nav>

<main class="container">
  <!-- Load components -->
  <router-outlet></router-outlet>
</main>

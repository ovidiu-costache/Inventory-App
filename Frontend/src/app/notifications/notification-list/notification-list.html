<div>
  <h2>Low Stock Alerts</h2>

  <div *ngIf="notifications.length === 0" class="alert-success">
    No current notifications. All products have sufficient stock.
  </div>

  <table *ngIf="notifications.length > 0" class="modern-table">
    <thead>
      <tr class="alert-warning">
        <th>Trigger Date</th>
        <th>Product Code</th>
        <th>Product Name</th>
        <th>Current Stock</th>
        <th>Reorder Threshold</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let n of notifications; trackBy: trackById">
        <td>{{ n.triggeredAt | date:'medium' }}</td>
        <td><strong>{{ n.productCode }}</strong></td>
        <td>{{ n.productName }}</td>
        <td class="text-danger fw-bold">{{ n.currentStock }}</td>
        <td>{{ n.reorderThreshold }}</td>
        <td>
          <button (click)="resolveNotification(n.id)" class="btn-success">
            Mark as resolved
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

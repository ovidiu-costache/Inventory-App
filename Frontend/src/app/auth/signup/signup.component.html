<div class="auth-container">
  <h2>Sign Up</h2>

  <div *ngIf="errorMessage" class="alert-error">
    <strong>Error:</strong> {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-3">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" [(ngModel)]="model.username" class="auth-input" required>
    </div>

    <div class="mb-3">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" [(ngModel)]="model.fullName" class="auth-input" required>
    </div>

    <div class="mb-3">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" [(ngModel)]="model.password" class="auth-input" required>
    </div>

    <div class="mb-3">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="model.confirmPassword" class="auth-input" required>
    </div>

    <button type="submit" [disabled]="isSubmitting" class="btn-success w-100">
      {{ isSubmitting ? 'Signing up...' : 'Sign Up' }}
    </button>
  </form>

  <div class="mt-3 text-center">
    Already have an account? <a routerLink="/login">Log In here</a>
  </div>
</div>
